apiVersion: v1
kind: Service
metadata:
  name: mongodb-ha-headless
  namespace: ekaguru-dev
  labels:
    app: mongodb-ha
spec:
  ports:
  - port: 27017
    name: peer
  clusterIP: None
  selector:
    app: mongodb-ha
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-ha
  namespace: ekaguru-dev
spec:
  ports:
  - port: 27017
    targetPort: 27017
  selector:
    app: mongodb-ha
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb-ha
  namespace: ekaguru-dev
spec:
  serviceName: mongodb-ha-headless
  replicas: 3
  selector:
    matchLabels:
      app: mongodb-ha
  template:
    metadata:
      labels:
        app: mongodb-ha
    spec:
      containers:
      - name: mongodb
        image: mongo:5.0
        command:
        - mongod
        - "--replSet"
        - "rs0"
        - "--bind_ip_all"
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongodb-ha-data
          mountPath: /data/db
  volumeClaimTemplates:
  - metadata:
      name: mongodb-ha-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-ha-headless
  namespace: ekaguru-dev
  labels:
    app: postgres-ha
spec:
  ports:
  - port: 5432
    name: postgres
  clusterIP: None
  selector:
    app: postgres-ha
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-ha
  namespace: ekaguru-dev
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres-ha
    role: primary # Selects only the primary (pod-0 implied or labelled)
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-ha
  namespace: ekaguru-dev
spec:
  serviceName: postgres-ha-headless
  replicas: 2
  selector:
    matchLabels:
      app: postgres-ha
  template:
    metadata:
      labels:
        app: postgres-ha
    spec:
      containers:
      - name: postgres
        image: postgres:15
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: postgres-password
        - name: POSTGRES_DB
          value: ekaguru_ha
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        # Simple replication setup simulated
        - name: POSTGRES_HOST_AUTH_METHOD
          value: "scram-sha-256"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-ha-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-ha-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
