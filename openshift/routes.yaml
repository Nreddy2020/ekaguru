apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ekaguru-frontend
  namespace: ekaguru-prod
  labels:
    app: ekaguru
    component: frontend
spec:
  to:
    kind: Service
    name: parent-dashboard
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ekaguru-api
  namespace: ekaguru-prod
  labels:
    app: ekaguru
    component: api
spec:
  path: /api
  to:
    kind: Service
    name: orchestrator-service
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
