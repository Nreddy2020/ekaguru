apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emergent-ingress
  namespace: emergent
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8001
