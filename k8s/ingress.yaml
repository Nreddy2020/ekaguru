apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emergent-ingress
  namespace: emergent
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - emergent.local
    secretName: emergent-tls-secret # This must match the secret we create
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
      - path: /api/
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8001
