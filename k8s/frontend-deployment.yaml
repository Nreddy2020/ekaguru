apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: emergent
  labels:
    app: emergent-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emergent-frontend
  template:
    metadata:
      labels:
        app: emergent-frontend
    spec:
      containers:
        - name: frontend
          image: registry:5000/emergent-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: emergent
  labels:
    app: emergent-frontend
spec:
  selector:
    app: emergent-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
