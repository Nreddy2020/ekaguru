version: '3.8'

services:
  postgres:
    image: ankane/pgvector:v0.7.0
    container_name: virtual-tutor-db
    environment:
      POSTGRES_DB: virtual_tutor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - virtual-tutor-network

  backend:
    build: ./backend
    container_name: virtual-tutor-backend
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/virtual_tutor
      - GOOGLE_LLM_KEY=${GOOGLE_LLM_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    networks:
      - virtual-tutor-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: virtual-tutor-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8001
    depends_on:
      - backend
    networks:
      - virtual-tutor-network
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:

networks:
  virtual-tutor-network:
    driver: bridge